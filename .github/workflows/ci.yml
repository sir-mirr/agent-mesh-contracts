name: CI

# This repository is the contract two other repositories build against, and it
# had no CI at all until today. The consequence was not hypothetical: the
# typecheck was red at HEAD on duplicate imports for at least four tags —
# `bun test` did not care and nobody ran `tsc`, so v0.21.0 through v0.23.0 were
# each cut over a failing check that existed and never ran.
#
# Tags are the unit of consumption here. A tag is immutable and other agents pin
# it, so a broken one cannot be fixed in place — which is the argument for
# checking every push and every tag rather than only `main`.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

  # **Re-run the current tree, without committing to it.**
  #
  # The reason first written here was that CI could not be re-requested at all.
  # That was wrong and was carried across three agents unchecked: `gh run rerun`
  # exists and works — measured. What it does *not* do is say when it has not
  # worked. On a run that expired against the job budget it returns exit 0,
  # prints nothing, and starts nothing; on a completed run the same command with
  # the same exit code queues one. So the capability looked absent because its
  # failure is silent, which is worse than absent — an absent tool sends you
  # looking, a silent one lets you believe it worked.
  #
  # This is still worth having, for the thing `rerun` cannot do: `rerun` replays
  # an old run, and every case today wanted the *current* tree re-examined. And
  # expired runs, which is what today's were, are exactly what `rerun` declines.
  #
  # It also separates two questions that look alike from outside — *is this tree
  # broken* and *was that run unlucky* — which cannot be told apart while
  # re-running requires a new commit, because the new commit is a different
  # tree.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # --frozen-lockfile: CI installs what the lockfile says or fails. A run
      # that silently resolves something else is not testing what will ship.
      - name: Install
        run: bun install --frozen-lockfile

      # First, and on its own step, because this is the check that was failing
      # unnoticed. `bun test` passing while `tsc` fails is the exact shape.
      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test
