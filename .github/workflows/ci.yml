name: CI

# This repository is the contract two other repositories build against, and it
# had no CI at all until today. The consequence was not hypothetical: the
# typecheck was red at HEAD on duplicate imports for at least four tags —
# `bun test` did not care and nobody ran `tsc`, so v0.21.0 through v0.23.0 were
# each cut over a failing check that existed and never ran.
#
# Tags are the unit of consumption here. A tag is immutable and other agents pin
# it, so a broken one cannot be fixed in place — which is the argument for
# checking every push and every tag rather than only `main`.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

  # **A green nobody can re-request is a green nobody can re-check.**
  #
  # Without this the only way to run CI again is to make a commit, so every
  # re-check costs a change to the thing being checked. Three situations today
  # needed one: a run that expired on the job budget with nothing to show, a
  # mutation entry that passed locally and failed here, and an install that
  # behaved differently on the runner than on any machine that could observe it.
  #
  # It also separates two questions that look alike from the outside — *is this
  # tree broken* and *was that run unlucky* — which cannot be told apart when
  # re-running requires a new tree.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # --frozen-lockfile: CI installs what the lockfile says or fails. A run
      # that silently resolves something else is not testing what will ship.
      - name: Install
        run: bun install --frozen-lockfile

      # First, and on its own step, because this is the check that was failing
      # unnoticed. `bun test` passing while `tsc` fails is the exact shape.
      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test
