name: CI

# This repository is the contract two other repositories build against, and it
# had no CI at all until today. The consequence was not hypothetical: the
# typecheck was red at HEAD on duplicate imports for at least four tags —
# `bun test` did not care and nobody ran `tsc`, so v0.21.0 through v0.23.0 were
# each cut over a failing check that existed and never ran.
#
# Tags are the unit of consumption here. A tag is immutable and other agents pin
# it, so a broken one cannot be fixed in place — which is the argument for
# checking every push and every tag rather than only `main`.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

  # **Re-run the current tree, without committing to it.**
  #
  # That is the whole reason, and it took two wrong ones to get here.
  #
  # The first was that CI could not be re-requested at all. Three agents carried
  # that unchecked and nobody pressed the button; `gh run rerun` works, on
  # completed and on expired runs alike, and refuses with exit 1 and a message
  # when an attempt is already in flight.
  #
  # The second was mine: that `rerun` failed silently on expired runs. It does
  # not. I ran it, then read a `gh run list` that did not contain the run I had
  # just re-run, and concluded from its absence that nothing had happened. The
  # attempt counter said otherwise the whole time.
  #
  # What survives both is the distinction that actually earns this trigger:
  # `rerun` replays *that run*, and every case here wanted the *current tree*
  # examined again. Those are different questions, and only one of them is
  # answered by re-running something from an hour ago.
  #
  # It also separates two states that look alike from outside — *this tree is
  # broken* and *that run was unlucky* — which cannot be told apart while
  # re-running needs a new commit, because a new commit is a different tree.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # --frozen-lockfile: CI installs what the lockfile says or fails. A run
      # that silently resolves something else is not testing what will ship.
      - name: Install
        run: bun install --frozen-lockfile

      # First, and on its own step, because this is the check that was failing
      # unnoticed. `bun test` passing while `tsc` fails is the exact shape.
      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test
